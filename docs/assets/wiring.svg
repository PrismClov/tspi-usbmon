<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" font-family="'Noto Sans CJK SC','Droid Sans Fallback',DejaVu Sans,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b3a55"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.6; }
      .box-accent { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .wire { stroke: #2b3a55; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .fpc { stroke: #059669; stroke-width: 2.6; fill: none; marker-end: url(#arrowG); }
    </style>
  </defs>

  <rect width="980" height="580" fill="#ffffff"/>

  <text x="40" y="40" class="title">泰山派 USB 副屏接线</text>
  <text x="40" y="64" class="sub">数据只走一根 USB-C；6 寸屏 + 背光超过 500mA，建议用带电源 HUB 或外接 5V</text>

  <!-- PC -->
  <rect class="box" x="40" y="96" width="200" height="116" rx="10"/>
  <text x="58" y="126" class="title">主机 PC</text>
  <text x="58" y="150" class="sub">Windows / Linux</text>
  <text x="58" y="172" class="tiny">IDD 驱动 / udisp_drm</text>
  <text x="58" y="192" class="tiny">优先 USB 3.0 口</text>

  <!-- Powered hub -->
  <rect class="box-accent" x="40" y="318" width="200" height="120" rx="10"/>
  <text x="58" y="348" class="title">带电源 USB HUB</text>
  <text x="58" y="372" class="sub">5V / 1A 墙充</text>
  <text x="58" y="394" class="tiny">同时给板子和背光供电</text>
  <text x="58" y="414" class="tiny">与主机共地即可</text>

  <!-- Pi -->
  <rect class="box" x="352" y="176" width="220" height="210" rx="10"/>
  <text x="372" y="208" class="title">立创泰山派</text>
  <text x="372" y="232" class="sub">RK3566 · Ubuntu 22.04</text>
  <text x="372" y="258" class="tiny">tspi-usbmon</text>
  <text x="372" y="278" class="tiny">FunctionFS + DRM/KMS</text>
  <text x="372" y="304" class="tiny">USB-C：device（peripheral）</text>
  <text x="372" y="324" class="tiny">DSI1 4 lane / PWM5 / I2C1</text>
  <text x="372" y="344" class="tiny">HDMI 与 USB-A 仍可用</text>
  <text x="372" y="366" class="tiny">解绑 adbd 或 takeover_udc=1</text>

  <!-- Panel -->
  <rect class="box" x="700" y="120" width="250" height="300" rx="10"/>
  <text x="718" y="152" class="title">mipi-hub 转接板</text>
  <text x="718" y="176" class="sub">+ 天马 6.0" 屏</text>
  <text x="718" y="202" class="tiny">TL060FVXS07/08</text>
  <text x="718" y="222" class="tiny">1080 × 2160，≈403 ppi</text>
  <text x="718" y="248" class="tiny">31pin 0.3mm FPC（反向）</text>
  <text x="718" y="268" class="tiny">6pin 0.5mm FPC（反向）</text>
  <text x="718" y="294" class="tiny">背光升压 + PWM 调光</text>
  <text x="718" y="314" class="tiny">incell 触摸 I2C 0x48</text>
  <text x="718" y="340" class="tiny">4 lane DSI，157 MHz</text>
  <text x="718" y="360" class="tiny">复位 GPIO3_C1</text>
  <text x="718" y="380" class="tiny">中断 GPIO1_A0</text>
  <text x="718" y="404" class="tiny">时序：1080+131 / 2160+22</text>

  <!-- PC -> HUB (data) -->
  <path class="wire" d="M 140 212 L 140 316"/>
  <text x="152" y="258" class="tiny">USB 2.0 HS 数据</text>
  <text x="152" y="278" class="tiny">（枚举 303a:2986）</text>

  <!-- HUB -> Pi (data + power) -->
  <path class="wire" d="M 240 372 C 300 372, 300 320, 350 320"/>
  <text x="252" y="398" class="tiny">数据 + 5V</text>

  <!-- Pi -> Panel FPCs -->
  <path class="fpc" d="M 572 246 L 698 246"/>
  <path class="fpc" d="M 572 312 L 698 312"/>
  <text x="584" y="236" class="tiny" fill="#047857">31pin DSI</text>
  <text x="584" y="334" class="tiny" fill="#047857">6pin 触摸/背光</text>

  <!-- notes -->
  <rect x="40" y="470" width="910" height="86" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="58" y="496" class="sub" fill="#9a3412">要点</text>
  <text x="58" y="518" class="tiny" fill="#9a3412">1. 两条 FPC 都是反向排线，插反不烧板但会黑屏 / 无触摸。</text>
  <text x="58" y="538" class="tiny" fill="#9a3412">2. 只插 PC 的 USB 口通常带不动背光，会反复重启。</text>
  <text x="500" y="518" class="tiny" fill="#9a3412">3. Type-C 固定为设备口，板子另两个 USB-A 仍是 host。</text>
  <text x="500" y="538" class="tiny" fill="#9a3412">4. adb 占着 UDC 时先 stop adbd，或设 takeover_udc = 1。</text>
</svg>
