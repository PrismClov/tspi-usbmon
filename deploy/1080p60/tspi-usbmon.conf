# 泰山派 Buildroot 镜像上的配置（S51usbdisplay 会读取）
# attach=1：不自己建 gadget，由 S51 把 ffs.udisp 并进 rockchip gadget
attach = 1
stream = 1920x1080
rotate = 90
host_rotate = 0
fps = 60
jpeg_quality = 7
max_frame_kb = 4096
splash = /usr/share/tspi-usbmon/splash.jpg
brightness = 80
verbose = 1

interface = tspiudisp0_R1920x1080_Ejpg7_Fps60_Bl4096
stretch = 1
