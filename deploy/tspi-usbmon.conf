# tspi-usbmon 配置文件
# 语法：key = value，# 或 ; 开头为注释
#
# 三种常用预设（改完 systemctl restart tspi-usbmon，主机侧重新插拔一次 USB）：
#   Linux（udisp_drm 默认 rotate=90）：stream=1080x2160  rotate=0   host_rotate=90
#   Windows 横放                     ：stream=2160x1080  rotate=90  host_rotate=0
#   竖放（任意系统）                  ：stream=1080x2160  rotate=0   host_rotate=0

# 上报给主机的画面尺寸（WxH）。面板原生是 1080x2160（竖屏）。
#   Linux 主机：保持 1080x2160 + rotate=0，驱动默认 rotate=90 会自己把桌面
#               转成竖屏再发过来，设备端直接 1:1 显示，最省 CPU。
#   Windows 主机：改成 stream=2160x1080、rotate=90，让 Windows 看到横向
#                2160x1080 桌面，设备端旋转 90 度后送到竖屏面板。
stream = 1080x2160

# 对收到的画面顺时针旋转多少度后再送显（0/90/180/270）
rotate = 0

# 主机驱动发送前对它的帧缓冲做了多少度旋转（只影响触摸坐标与 HID 描述符）。
#   Linux udisp_drm 默认 rotate=90（主机是横屏 2160x1080）  -> host_rotate = 90
#   Linux host_native=1 / rotate=0（主机是竖屏 1080x2160） -> host_rotate = 0
#   Windows IDD 不做旋转                                  -> host_rotate = 0
host_rotate = 90

# 上报给主机的刷新率，用于 EDID 与发送节流
fps = 30

# 上报给主机的 JPEG 质量 1..10（越大越清晰、带宽越高）
jpeg_quality = 6

# 单帧最大字节数（同时作为 Bl 参数上报，防止主机发来超大帧）
max_frame_kb = 4096

# DRM 设备与连接器，auto 表示自动找 DSI 接口
card = /dev/dri/card0
connector = auto
mode = auto

# 背光 0..255，-1 表示不修改
brightness = 200

# 触摸设备，auto 表示扫描 /dev/input/event*
touch = auto

# UDC 名称，auto 表示取 /sys/class/udc 里的第一个
udc = auto

# 官方镜像默认用同一个 UDC 跑 adb，会把我们的 gadget 挡在门外。
#   0 = 检测到冲突就报错退出（推荐，先 systemctl stop adbd）
#   1 = 自动解绑占用者再绑定（会断掉 adb，调试完记得改回 0）
takeover_udc = 0

# USB VID/PID 必须保持 303a:2986（Windows IDD 驱动按这个匹配）
vid = 0x303a
pid = 0x2986
product = auto
interface = auto

# 无主机连接时显示的待机图（JPEG）
splash = /usr/share/tspi-usbmon/splash.jpg

# 0=普通 1=info 2=debug
verbose = 1
